[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genome-report"
version = "0.1.0"
description = "Read consumer DNA exports and produce an annotated report, entirely offline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
genome-report = "genome_report.cli:main"

[tool.setuptools.packages.find]
include = ["genome_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

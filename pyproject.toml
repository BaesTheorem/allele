[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allele"
version = "0.1.0"
description = "Turn a consumer DNA export into an annotated, honestly-caveated report. Runs entirely offline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
allele = "allele.cli:main"

[tool.setuptools.packages.find]
include = ["allele*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
